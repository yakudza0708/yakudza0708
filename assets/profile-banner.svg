<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Yakudza — privacy tools and infrastructure</title>
  <desc id="desc">Dark developer profile banner with a cyan and violet network motif.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080b14"/>
      <stop offset=".52" stop-color="#0d1324"/>
      <stop offset="1" stop-color="#120d25"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#2dd4bf"/>
      <stop offset=".5" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glowA">
      <stop stop-color="#22d3ee" stop-opacity=".28"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB">
      <stop stop-color="#8b5cf6" stop-opacity=".3"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse">
      <path d="M38 0H0V38" fill="none" stroke="#94a3b8" stroke-opacity=".055"/>
    </pattern>
    <filter id="soft">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="24" fill="url(#grid)"/>
  <circle cx="180" cy="60" r="250" fill="url(#glowA)"/>
  <circle cx="1090" cy="300" r="330" fill="url(#glowB)"/>

  <g opacity=".78" fill="none" stroke-linecap="round">
    <path d="M750 82C842 10 918 157 1018 72S1158 73 1190 28" stroke="#38bdf8" stroke-opacity=".32" stroke-width="2"/>
    <path d="M716 244c112-106 198 22 278-34 75-53 133-34 206 20" stroke="#a78bfa" stroke-opacity=".34" stroke-width="2"/>
    <path d="M825 162h74l39-42h83l42 51h92" stroke="url(#accent)" stroke-opacity=".5" stroke-width="2"/>
    <g fill="#0d1324" stroke-width="3">
      <circle cx="825" cy="162" r="7" stroke="#2dd4bf"/>
      <circle cx="899" cy="162" r="7" stroke="#38bdf8"/>
      <circle cx="938" cy="120" r="7" stroke="#60a5fa"/>
      <circle cx="1021" cy="120" r="7" stroke="#818cf8"/>
      <circle cx="1063" cy="171" r="7" stroke="#a78bfa"/>
      <circle cx="1155" cy="171" r="7" stroke="#c084fc"/>
    </g>
  </g>

  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="72" y="120" fill="#f8fafc" font-size="58" font-weight="750" letter-spacing="-2">YAKUDZA</text>
    <rect x="74" y="143" width="338" height="4" rx="2" fill="url(#accent)"/>
    <text x="74" y="190" fill="#cbd5e1" font-size="23" font-weight="500">privacy tools · infrastructure · clean interfaces</text>
    <text x="74" y="238" fill="#64748b" font-size="16" letter-spacing="3">BUILDING THE COMPLEX INTO SOMETHING SIMPLE</text>
  </g>

  <rect x=".75" y=".75" width="1198.5" height="318.5" rx="23.25" fill="none" stroke="#94a3b8" stroke-opacity=".16" stroke-width="1.5"/>
</svg>